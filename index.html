<!DOCTYPE html>
<html lang="zh-HK">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>街頭大廚：雞蛋仔專賣店 Deluxe 🍳</title>
  <style>
    * { box-sizing: border-box; }
    body {
      font-family: "PingFang HK", "Microsoft JhengHei", system-ui, sans-serif;
      background: linear-gradient(135deg, #2c1a1d 0%, #1a0f12 100%);
      color: #fff;
      text-align: center;
      margin: 0;
      padding: 15px;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }

    /* 畫布粒子層 */
    #particleCanvas {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 999;
    }

    h1 {
      color: #ffb74d;
      margin: 0 0 10px 0;
      font-size: 26px;
      text-shadow: 0 0 10px rgba(255, 183, 77, 0.4);
    }

    .game-container {
      width: 100%;
      max-width: 460px;
      background: rgba(45, 30, 35, 0.85);
      backdrop-filter: blur(10px);
      padding: 20px;
      border-radius: 20px;
      box-shadow: 0 12px 30px rgba(0,0,0,0.5), 0 0 20px rgba(230, 126, 34, 0.2);
      border: 1px solid rgba(255, 183, 77, 0.2);
      position: relative;
    }

    .status-bar {
      display: flex;
      justify-content: space-between;
      font-size: 16px;
      font-weight: bold;
      color: #ffd180;
      background: rgba(0,0,0,0.4);
      padding: 12px 18px;
      border-radius: 12px;
      margin-bottom: 12px;
      border: 1px solid rgba(255, 209, 128, 0.1);
    }

    .order-box {
      background: linear-gradient(135deg, #d84315 0%, #bf360c 100%);
      padding: 14px;
      border-radius: 14px;
      font-size: 18px;
      font-weight: bold;
      color: #ffffff;
      margin-bottom: 15px;
      box-shadow: 0 4px 15px rgba(216, 67, 21, 0.4);
      position: relative;
      overflow: hidden;
    }

    .combo-badge {
      color: #ffe082;
      font-size: 14px;
      margin-top: 4px;
      font-weight: 800;
      letter-spacing: 1px;
    }

    /* 烤盤 3D 效果容器 */
    .pan-wrapper {
      perspective: 800px;
      position: relative;
      margin: 15px auto;
      width: 210px;
      height: 210px;
    }

    /* 蒸氣動畫特效 */
    .steam {
      position: absolute;
      top: -20px;
      left: 50%;
      transform: translateX(-50%);
      font-size: 24px;
      opacity: 0;
      pointer-events: none;
    }
    .baking .steam {
      animation: steamUp 1.5s infinite ease-in-out;
    }
    @keyframes steamUp {
      0% { transform: translate(-50%, 0) scale(0.8); opacity: 0; }
      50% { opacity: 0.7; }
      100% { transform: translate(-50%, -30px) scale(1.3); opacity: 0; }
    }

    /* 雞蛋仔模具外觀 */
    .pan {
      width: 210px;
      height: 210px;
      background: radial-gradient(circle, #424242 0%, #212121 100%);
      border-radius: 50%;
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 7px;
      padding: 16px;
      box-sizing: border-box;
      transition: transform 0.6s cubic-bezier(0.4, 0, 0.2, 1);
      box-shadow: 0 10px 20px rgba(0,0,0,0.6), inset 0 0 15px #000;
      border: 4px solid #555;
    }

    .bubble {
      background: #1a1a1a;
      border-radius: 50%;
      box-shadow: inset 0 3px 6px rgba(0,0,0,0.8);
      transition: background-color 0.4s ease, transform 0.2s ease, box-shadow 0.4s ease;
    }

    /* 口味與成熟度風格 */
    .bubble.raw-original { background: #ffe082; box-shadow: inset 0 -3px 6px rgba(255,160,0,0.5); }
    .bubble.raw-matcha { background: #a5d6a7; box-shadow: inset 0 -3px 6px rgba(56,142,60,0.5); }
    .bubble.raw-choco { background: #bcaaa4; box-shadow: inset 0 -3px 6px rgba(78,52,46,0.5); }

    .bubble.perfect {
      background: linear-gradient(135deg, #ffb74d 0%, #e65100 100%) !important;
      box-shadow: 0 0 10px #ffb74d, inset 0 2px 4px rgba(255,255,255,0.6) !important;
      transform: scale(1.05);
    }
    .bubble.burnt {
      background: #211107 !important;
      box-shadow: inset 0 0 8px #000 !important;
      transform: scale(0.95);
    }

    /* 霓虹進度條 */
    .progress-container {
      width: 85%;
      height: 14px;
      background-color: rgba(255,255,255,0.1);
      border-radius: 7px;
      margin: 12px auto;
      overflow: hidden;
      border: 1px solid rgba(255,255,255,0.15);
    }
    .progress-bar {
      width: 0%;
      height: 100%;
      background: linear-gradient(90deg, #ffb74d, #81c784);
      transition: width 0.18s linear;
      box-shadow: 0 0 10px rgba(129, 199, 132, 0.5);
    }
    
    .btn-group {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 10px;
      margin-top: 15px;
    }
    button {
      padding: 10px 16px;
      font-size: 15px;
      border: none;
      border-radius: 10px;
      background: linear-gradient(135deg, #ffa726 0%, #fb8c00 100%);
      color: white;
      cursor: pointer;
      font-weight: bold;
      transition: all 0.2s ease;
      box-shadow: 0 4px 10px rgba(0,0,0,0.3);
    }
    button:disabled {
      background: #424242 !important;
      color: #757575;
      cursor: not-allowed;
      box-shadow: none;
    }
    button:hover:not(:disabled) {
      transform: translateY(-2px);
      box-shadow: 0 6px 15px rgba(255, 167, 38, 0.4);
    }
    button:active:not(:disabled) {
      transform: translateY(1px);
    }
    
    .flavor-btn {
      background: #5e35b1;
    }
    .flavor-btn.active {
      background: linear-gradient(135deg, #ab47bc 0%, #7b1fa2 100%);
      box-shadow: 0 0 12px #ab47bc;
      border: 1px solid #e1bee7;
    }

    .status-msg {
      margin-top: 10px;
      font-size: 15px;
      font-weight: bold;
      min-height: 24px;
      color: #ffe0b2;
    }
  </style>
</head>
<body>

  <!-- 粒子特效層 -->
  <canvas id="particleCanvas"></canvas>

  <div class="game-container">
    <h1>🧇 街頭雞蛋仔大作戰 Deluxe</h1>
    
    <div class="status-bar">
      <div>⏳ 時間: <span id="timeLeft">60</span>s</div>
      <div>💰 營業額: $<span id="score">0</span></div>
    </div>

    <div class="order-box" id="orderBox">
      點擊「開始營業」開啟專賣店！
      <div class="combo-badge" id="comboBadge"></div>
    </div>

    <!-- 烤盤與蒸氣特效 -->
    <div class="pan-wrapper" id="panWrapper">
      <div class="steam">💨</div>
      <div class="pan" id="pan">
        <div class="bubble"></div><div class="bubble"></div><div class="bubble"></div><div class="bubble"></div>
        <div class="bubble"></div><div class="bubble"></div><div class="bubble"></div><div class="bubble"></div>
        <div class="bubble"></div><div class="bubble"></div><div class="bubble"></div><div class="bubble"></div>
        <div class="bubble"></div><div class="bubble"></div><div class="bubble"></div><div class="bubble"></div>
      </div>
    </div>

    <!-- 烘烤進度條 -->
    <div class="progress-container">
      <div class="progress-bar" id="progressBar"></div>
    </div>

    <div class="status-msg" id="statusMsg">請點擊開始營業</div>

    <div class="btn-group">
      <button id="startBtn" onclick="startGame()">▶️ 開始營業</button>
    </div>

    <div class="btn-group" id="gameControls" style="display:none;">
      <button class="flavor-btn active" id="btn-original" onclick="selectFlavor('original')">🥞 原味</button>
      <button class="flavor-btn" id="btn-matcha" onclick="selectFlavor('matcha')">🍵 抹茶</button>
      <button class="flavor-btn" id="btn-choco" onclick="selectFlavor('choco')">🍫 朱古力</button>
      <button id="pourBtn" onclick="pourBatter()">🫗 倒麵糊</button>
      <button id="flipBtn" onclick="flipPan()" disabled>🔄 翻轉烘烤</button>
      <button id="serveBtn" onclick="serveEggette()" disabled>🍽️ 出爐裝盤</button>
    </div>
  </div>

  <script>
    // --- Web Audio API 音效生成器 ---
    const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    function playSound(type) {
      if (audioCtx.state === 'suspended') audioCtx.resume();
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.connect(gain);
      gain.connect(audioCtx.destination);

      const now = audioCtx.currentTime;
      if (type === 'click') {
        osc.frequency.setValueAtTime(400, now);
        gain.gain.setValueAtTime(0.1, now);
        gain.gain.exponentialRampToValueAtTime(0.01, now + 0.05);
        osc.start(now); osc.stop(now + 0.05);
      } else if (type === 'pour') {
        osc.type = 'triangle';
        osc.frequency.setValueAtTime(200, now);
        osc.frequency.exponentialRampToValueAtTime(600, now + 0.2);
        gain.gain.setValueAtTime(0.15, now);
        gain.gain.exponentialRampToValueAtTime(0.01, now + 0.2);
        osc.start(now); osc.stop(now + 0.2);
      } else if (type === 'flip') {
        osc.type = 'sine';
        osc.frequency.setValueAtTime(150, now);
        osc.frequency.linearRampToValueAtTime(300, now + 0.15);
        gain.gain.setValueAtTime(0.2, now);
        gain.gain.exponentialRampToValueAtTime(0.01, now + 0.15);
        osc.start(now); osc.stop(now + 0.15);
      } else if (type === 'success') {
        osc.type = 'sine';
        osc.frequency.setValueAtTime(523.25, now); // C5
        osc.frequency.setValueAtTime(659.25, now + 0.08); // E5
        osc.frequency.setValueAtTime(783.99, now + 0.16); // G5
        gain.gain.setValueAtTime(0.2, now);
        gain.gain.exponentialRampToValueAtTime(0.01, now + 0.35);
        osc.start(now); osc.stop(now + 0.35);
      } else if (type === 'fail') {
        osc.type = 'sawtooth';
        osc.frequency.setValueAtTime(180, now);
        osc.frequency.linearRampToValueAtTime(100, now + 0.3);
        gain.gain.setValueAtTime(0.2, now);
        gain.gain.exponentialRampToValueAtTime(0.01, now + 0.3);
        osc.start(now); osc.stop(now + 0.3);
      }
    }

    // --- 粒子噴發特效 (Canvas) ---
    const canvas = document.getElementById('particleCanvas');
    const ctx = canvas.getContext('2d');
    let particles = [];
    function resizeCanvas() {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
    }
    window.addEventListener('resize', resizeCanvas);
    resizeCanvas();

    function createParticles(x, y) {
      for (let i = 0; i < 30; i++) {
        particles.push({
          x: x, y: y,
          vx: (Math.random() - 0.5) * 10,
          vy: (Math.random() - 0.7) * 10,
          color: ['#ffb74d', '#ffe082', '#fff176', '#ff8f00'][Math.floor(Math.random() * 4)],
          size: Math.random() * 6 + 4,
          life: 1
        });
      }
    }
    function updateParticles() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      particles.forEach((p, index) => {
        p.x += p.vx;
        p.y += p.vy;
        p.vy += 0.3; // 重力
        p.life -= 0.02;
        ctx.fillStyle = p.color;
        ctx.globalAlpha = Math.max(0, p.life);
        ctx.beginPath();
        ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
        ctx.fill();
        if (p.life <= 0) particles.splice(index, 1);
      });
      requestAnimationFrame(updateParticles);
    }
    updateParticles();

    // --- 遊戲邏輯 ---
    const flavors = {
      original: { name: '原味', class: 'raw-original' },
      matcha: { name: '抹茶', class: 'raw-matcha' },
      choco: { name: '朱古力', class: 'raw-choco' }
    };

    let score = 0;
    let timeLeft = 60;
    let combo = 0;
    let gameTimer = null;
    let bakeTimer = null;
    let bakeProgress = 0;
    let currentFlavor = 'original';
    let currentOrder = '';
    let isFlipped = false;
    let isPlaying = false;

    const pan = document.getElementById('pan');
    const panWrapper = document.getElementById('panWrapper');
    const bubbles = document.querySelectorAll('.bubble');
    const statusMsg = document.getElementById('statusMsg');
    const scoreDisplay = document.getElementById('score');
    const timeLeftDisplay = document.getElementById('timeLeft');
    const orderBox = document.getElementById('orderBox');
    const comboBadge = document.getElementById('comboBadge');
    const progressBar = document.getElementById('progressBar');

    const pourBtn = document.getElementById('pourBtn');
    const flipBtn = document.getElementById('flipBtn');
    const serveBtn = document.getElementById('serveBtn');

    function startGame() {
      playSound('click');
      score = 0;
      timeLeft = 60;
      combo = 0;
      isPlaying = true;
      scoreDisplay.innerText = score;
      timeLeftDisplay.innerText = timeLeft;
      comboBadge.innerText = "";
      
      document.getElementById('startBtn').style.display = 'none';
      document.getElementById('gameControls').style.display = 'flex';

      nextOrder();
      resetPan();

      gameTimer = setInterval(() => {
        timeLeft--;
        timeLeftDisplay.innerText = timeLeft;
        if (timeLeft <= 0) {
          endGame();
        }
      }, 1000);
    }

    function nextOrder() {
      const keys = Object.keys(flavors);
      currentOrder = keys[Math.floor(Math.random() * keys.length)];
      orderBox.innerHTML = `🙋‍♂️ 顧客訂單：【${flavors[currentOrder].name}雞蛋仔】！<div class="combo-badge" id="comboBadge">${combo > 1 ? '🔥 連擊 x' + combo + '！' : ''}</div>`;
    }

    function selectFlavor(flavor) {
      playSound('click');
      currentFlavor = flavor;
      document.querySelectorAll('.flavor-btn').forEach(btn => btn.classList.remove('active'));
      document.getElementById(`btn-${flavor}`).classList.add('active');
    }

    function pourBatter() {
      playSound('pour');
      bubbles.forEach(b => {
        b.className = 'bubble ' + flavors[currentFlavor].class;
      });
      statusMsg.innerText = "麵糊已注入！趕快「翻轉烘烤」！";
      pourBtn.disabled = true;
      flipBtn.disabled = false;
    }

    function flipPan() {
      playSound('flip');
      isFlipped = !isFlipped;
      pan.style.transform = isFlipped ? 'rotate(180deg)' : 'rotate(0deg)';
      panWrapper.classList.add('baking');
      
      statusMsg.innerText = "烘烤中... 看準綠色熱力區出爐！";
      flipBtn.disabled = true;
      serveBtn.disabled = false;

      bakeProgress = 0;
      bakeTimer = setInterval(() => {
        bakeProgress += 5;
        progressBar.style.width = bakeProgress + '%';

        if (bakeProgress >= 50 && bakeProgress <= 80) {
          progressBar.style.background = 'linear-gradient(90deg, #81c784, #4caf50)';
          bubbles.forEach(b => b.classList.add('perfect'));
        } else if (bakeProgress > 80) {
          progressBar.style.background = 'linear-gradient(90deg, #e57373, #f44336)';
          bubbles.forEach(b => b.classList.add('burnt'));
        }
      }, 180);
    }

    function serveEggette() {
      clearInterval(bakeTimer);
      panWrapper.classList.remove('baking');
      serveBtn.disabled = true;

      let resultMsg = "";
      let earned = 0;
      const isCorrectFlavor = (currentFlavor === currentOrder);
      
      if (bakeProgress < 50) {
        playSound('fail');
        resultMsg = "❌ 太早出爐，麵糊未熟！($0)";
        combo = 0;
      } else if (bakeProgress > 80) {
        playSound('fail');
        resultMsg = "😭 烤焦了！顧客拂袖而去！(-$20)";
        earned = -20;
        combo = 0;
      } else if (!isCorrectFlavor) {
        playSound('fail');
        resultMsg = `😅 口味錯誤！顧客想要的是${flavors[currentOrder].name}！(+$20)`;
        earned = 20;
        combo = 0;
      } else {
        playSound('success');
        combo++;
        let bonus = (combo > 1) ? combo * 20 : 0;
        earned = 100 + bonus;
        
        // 觸發畫面上半部金幣粒子爆發
        const rect = serveBtn.getBoundingClientRect();
        createParticles(rect.left + rect.width / 2, rect.top);

        if (Math.random() < 0.4) {
          timeLeft += 3;
          resultMsg = `🎉 完美金黃！(+$100, ⏱️ 獎勵加時 +3秒)`;
        } else {
          resultMsg = `🎉 完美金黃！(+$100 ${bonus > 0 ? ', 連擊獎勵 +$' + bonus : ''})`;
        }
      }

      score += earned;
      if (score < 0) score = 0;
      scoreDisplay.innerText = score;
      statusMsg.innerText = resultMsg;

      setTimeout(() => {
        if (isPlaying) {
          nextOrder();
          resetPan();
        }
      }, 1400);
    }

    function resetPan() {
      bakeProgress = 0;
      progressBar.style.width = '0%';
      progressBar.style.background = 'linear-gradient(90deg, #ffb74d, #81c784)';
      pan.style.transform = 'rotate(0deg)';
      panWrapper.classList.remove('baking');
      isFlipped = false;
      bubbles.forEach(b => b.className = 'bubble');
      
      pourBtn.disabled = false;
      flipBtn.disabled = true;
      serveBtn.disabled = true;
      statusMsg.innerText = "請選擇口味並倒入麵糊。";
    }

    function endGame() {
      isPlaying = false;
      clearInterval(gameTimer);
      clearInterval(bakeTimer);
      panWrapper.classList.remove('baking');
      
      let title = "街頭實習生";
      if (score >= 900) title = "🏆 港式雞蛋仔傳奇大師";
      else if (score >= 600) title = "🌟 爆款人氣名廚";
      else if (score >= 300) title = "👨‍🍳 熟練雞蛋仔師傅";

      orderBox.innerHTML = `⏰ 打烊收工！獲頒稱號：<br><b>【${title}】</b>`;
      statusMsg.innerText = `🎉 本日總營業額：$${score} 元！`;
      
      document.getElementById('startBtn').innerText = "🔄 再次營業";
      document.getElementById('startBtn').style.display = 'inline-block';
      document.getElementById('gameControls').style.display = 'none';
    }
  </script>
</body>
</html>
