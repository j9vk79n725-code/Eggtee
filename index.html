<!DOCTYPE html>
<html lang="zh-HK">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>街頭大廚：雞蛋仔大作戰 🍳</title>
  <style>
    body {
      font-family: "PingFang HK", "Microsoft JhengHei", sans-serif;
      background-color: #fff8e7;
      text-align: center;
      margin: 0;
      padding: 20px;
    }
    h1 { color: #d35400; }
    .game-container {
      max-width: 500px;
      margin: 0 auto;
      background: #ffffff;
      padding: 20px;
      border-radius: 15px;
      box-shadow: 0 8px 16px rgba(0,0,0,0.1);
    }
    .score-board {
      font-size: 20px;
      font-weight: bold;
      color: #e67e22;
      margin-bottom: 15px;
    }
    /* 雞蛋仔模具外觀 */
    .pan {
      width: 220px;
      height: 220px;
      background-color: #444;
      border-radius: 50%;
      margin: 20px auto;
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 8px;
      padding: 20px;
      box-sizing: border-box;
      transition: transform 0.6s ease;
      box-shadow: inset 0 0 10px #000;
    }
    /* 雞蛋仔單個小球 */
    .bubble {
      background-color: #222;
      border-radius: 50%;
      transition: background-color 0.5s ease;
    }
    /* 狀態顏色 */
    .bubble.raw { background-color: #fff3a0; }      /* 剛倒麵糊 */
    .bubble.perfect { background-color: #e67e22; }  /* 金黃酥脆 */
    .bubble.burnt { background-color: #3e2723; }    /* 烤焦 */

    /* 按鈕樣式 */
    .btn-group {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 10px;
      margin-top: 20px;
    }
    button {
      padding: 10px 18px;
      font-size: 16px;
      border: none;
      border-radius: 8px;
      background-color: #f39c12;
      color: white;
      cursor: pointer;
      font-weight: bold;
      transition: 0.2s;
    }
    button:disabled {
      background-color: #ccc;
      cursor: not-allowed;
    }
    button:hover:not(:disabled) {
      background-color: #d35400;
    }
    .status-msg {
      margin-top: 15px;
      font-size: 18px;
      font-weight: bold;
      min-height: 27px;
      color: #333;
    }
  </style>
</head>
<body>

  <div class="game-container">
    <h1>🥞 港式雞蛋仔模擬器</h1>
    <div class="score-board">總得分：<span id="score">0</span> 分</div>

    <!-- 雞蛋仔烤盤 (16個孔) -->
    <div class="pan" id="pan">
      <div class="bubble"></div><div class="bubble"></div><div class="bubble"></div><div class="bubble"></div>
      <div class="bubble"></div><div class="bubble"></div><div class="bubble"></div><div class="bubble"></div>
      <div class="bubble"></div><div class="bubble"></div><div class="bubble"></div><div class="bubble"></div>
      <div class="bubble"></div><div class="bubble"></div><div class="bubble"></div><div class="bubble"></div>
    </div>

    <div class="status-msg" id="statusMsg">請先調配麵糊！</div>

    <div class="btn-group">
      <button id="mixBtn" onclick="mixBatter()">🥣 攪拌麵糊</button>
      <button id="pourBtn" onclick="pourBatter()" disabled>🫗 倒麵糊</button>
      <button id="flipBtn" onclick="flipPan()" disabled>🔄 翻轉模具 (開始烘烤)</button>
      <button id="serveBtn" onclick="serveEggette()" disabled>🍽️ 出爐裝盤！</button>
    </div>
  </div>

  <script>
    let score = 0;
    let state = 'INIT'; // INIT, MIXED, POURED, BAKING, READY
    let bakeTimer = null;
    let secondsBaked = 0;
    let isFlipped = false;

    const pan = document.getElementById('pan');
    const bubbles = document.querySelectorAll('.bubble');
    const statusMsg = document.getElementById('statusMsg');
    const scoreDisplay = document.getElementById('score');

    const mixBtn = document.getElementById('mixBtn');
    const pourBtn = document.getElementById('pourBtn');
    const flipBtn = document.getElementById('flipBtn');
    const serveBtn = document.getElementById('serveBtn');

    // 1. 攪拌麵糊
    function mixBatter() {
      state = 'MIXED';
      statusMsg.innerText = "麵糊調配好囉！點擊「倒麵糊」。";
      mixBtn.disabled = true;
      pourBtn.disabled = false;
    }

    // 2. 倒入麵糊
    function pourBatter() {
      state = 'POURED';
      bubbles.forEach(b => b.classList.add('raw'));
      statusMsg.innerText = "麵糊已倒滿！趕快「翻轉模具」讓受熱均勻！";
      pourBtn.disabled = true;
      flipBtn.disabled = false;
    }

    // 3. 翻轉模具並開始計時烘烤
    function flipPan() {
      state = 'BAKING';
      isFlipped = !isFlipped;
      pan.style.transform = isFlipped ? 'rotate(180deg)' : 'rotate(0deg)';
      
      statusMsg.innerText = "正在烘烤中... 注意控制時間！(目標：3~5秒)";
      flipBtn.disabled = true;
      serveBtn.disabled = false;

      secondsBaked = 0;
      bakeTimer = setInterval(() => {
        secondsBaked++;
        
        // 根據烘烤時間改變雞蛋仔顏色
        if (secondsBaked >= 3 && secondsBaked <= 5) {
          bubbles.forEach(b => {
            b.classList.remove('raw');
            b.classList.add('perfect');
          });
        } else if (secondsBaked > 5) {
          bubbles.forEach(b => {
            b.classList.remove('perfect');
            b.classList.add('burnt');
          });
          statusMsg.innerText = "⚠️ 太香（焦）啦！快點出爐！";
        }
      }, 1000);
    }

    // 4. 出爐結算分數
    function serveEggette() {
      clearInterval(bakeTimer);
      serveBtn.disabled = true;

      if (secondsBaked < 3) {
        statusMsg.innerText = "❌ 失敗！麵糊還沒熟，軟綿綿的無法吃！(+0分)";
      } else if (secondsBaked >= 3 && secondsBaked <= 5) {
        statusMsg.innerText = "🎉 太棒了！完美的外酥內軟金黃雞蛋仔！(+100分)";
        score += 100;
      } else {
        statusMsg.innerText = "😭 糟糕，雞蛋仔烤焦變黑炭了！(+10分)";
        score += 10;
      }

      scoreDisplay.innerText = score;

      // 3秒後重置烤盤準備下一局
      setTimeout(resetGame, 3000);
    }

    // 重置遊戲 state
    function resetGame() {
      state = 'INIT';
      secondsBaked = 0;
      isFlipped = false;
      pan.style.transform = 'rotate(0deg)';
      bubbles.forEach(b => {
        b.className = 'bubble';
      });
      statusMsg.innerText = "請先調配麵糊！";
      mixBtn.disabled = false;
    }
  </script>
</body>
</html>
